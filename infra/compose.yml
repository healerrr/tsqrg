name: aquarium
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: aquarium
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置独立的数据库密码}
      TZ: Asia/Shanghai
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  game:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: game
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://aquarium:${POSTGRES_PASSWORD}@db:5432/aquarium
      APP_ORIGIN: ${APP_ORIGIN:?请设置同域HTTPS访问地址}
      SESSION_SECRET: ${SESSION_SECRET:?请设置至少32字节随机会话密钥}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?请设置至少24字节随机监控令牌}
      OPERATIONS_CHECK_INTERVAL_MS: ${OPERATIONS_CHECK_INTERVAL_MS:-60000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-35000}
      UPLOAD_DIR: /data/uploads
      GAME_TIMEZONE: Asia/Shanghai
      RULES_VERSION: 1.0.0
      LOG_LEVEL: info
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
    stop_grace_period: 45s
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      game:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  uploads:

